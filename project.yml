# project.yml — XcodeGen project spec for DebianTerminal.
#
# Generate the Xcode project with:
#     brew install xcodegen
#     xcodegen generate
#
# Or open the checked-in DebianTerminal.xcodeproj directly (this project.yml is
# the source of truth; regenerate after changing the file set).
name: DebianTerminal
options:
  bundleIdPrefix: dev.debianterminal
  # XcodeGen 2.45+ emits the pbxproj in Xcode 16's object format (objectVersion
  # 77) which Xcode <=15.4 cannot open ("future Xcode project file format").
  # The CI workflow therefore builds on the macos-15 (Xcode 16) runner.
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_ENTITLEMENTS: App/DebianTerminal.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ONLY_ACTIVE_ARCH: YES
    # JIT / subprocess / developer-mode friendly
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""   # set your Apple team id for device signing

targets:
  DebianTerminal:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Terminal
      - path: VM
    resources:
      # Bundle the runtime artifacts as individual files so Xcode's Copy
      # Bundle Resources phase reliably ships them (a `type: folder` reference
      # was observed NOT reaching the built .app). They land at the app bundle
      # root (`DebianTerminal.app/Image`, `.../initrd.img`), which
      # VMConfig.bundledQEMUURL() and seedRuntimeFilesFromBundle() resolve.
      # debian12.img is NOT bundled (8 GiB); the app seeds Image/initrd/qemu
      # from the bundle into Documents/Debian on first launch.
      - path: Resources/Image
      - path: Resources/initrd.img
      # Built by Scripts/build-qemu.sh; kept out of the repo so the Linux CI
      # build (which has no QEMU-for-iOS binary) still passes. When present it
      # is bundled automatically.
      - path: Resources/qemu-system-aarch64
        optional: TRUE
    info:
      path: App/Info.plist
    entitlements:
      path: App/DebianTerminal.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.debianterminal.app
        PRODUCT_NAME: DebianTerminal
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DebianTerminal.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO

# A buildable scheme so `xcodebuild -scheme DebianTerminal` and IPA packaging work.
schemes:
  DebianTerminal:
    build:
      targets:
        DebianTerminal: all
    run:
      config: Debug
    archive:
      config: Release
