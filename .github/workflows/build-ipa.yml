name: Build IPA

# Build the DebianTerminal iOS app on a macOS runner and package it as an .ipa.
# Runs on every push to main and on manual dispatch.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    # XcodeGen 2.45+ emits the .pbxproj in Xcode 16's object format (77), which
    # Xcode <=15.4 (macos-14) cannot open — so build on macos-15 / Xcode 16.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      # Signed path requires these secrets, set in the repo Settings -> Secrets:
      #   APPLE_TEAM_ID             (e.g. ABCDE12345)
      #   APPLE_CERT_P12_BASE64     (developer cert exported from Keychain as .p12, base64)
      #   APPLE_CERT_P12_PASSWORD   (password of the .p12)
      #   APPLE_PROVISIONING_BASE64 (matching .mobileprovision, base64)
      # Without them we produce an UNSIGNED .ipa (compiles, but iOS will refuse
      # to install a signed-only bundle; JIT also needs dev signing + Developer Mode).
      - name: Build & export IPA (signed or unsigned)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_PROVISIONING_BASE64: ${{ secrets.APPLE_PROVISIONING_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          SIGNED=0
          if [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_CERT_P12_BASE64:-}" ] && [ -n "${APPLE_PROVISIONING_BASE64:-}" ]; then
            SIGNED=1
          fi

          if [ "$SIGNED" = "1" ]; then
            echo "==> Setting up signing identity (team $APPLE_TEAM_ID)"
            CERT_P12="$RUNNER_TEMP/cert.p12"
            echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$CERT_P12"
            KEYCHAIN="$RUNNER_TEMP/build.keychain"
            security create-keychain -p "" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            security import "$CERT_P12" -k "$KEYCHAIN" -P "${APPLE_CERT_P12_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

            echo "==> Installing provisioning profile"
            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILE_DIR"
            echo "$APPLE_PROVISIONING_BASE64" | base64 -d > "$PROFILE_DIR/build.mobileprovision"
            security cms -D -i "$PROFILE_DIR/build.mobileprovision" | grep -o '<key>UUID</key><string>[^<]*</string>' | sed 's/<key>UUID<\/key><string>//;s/<\/string>//' | xargs -I{} cp "$PROFILE_DIR/build.mobileprovision" "$PROFILE_DIR/{}.mobileprovision" || true

            echo "==> Archive (signed)"
            xcodebuild -project DebianTerminal.xcodeproj -scheme DebianTerminal \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/DebianTerminal.xcarchive \
              CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              archive

            echo "==> Export IPA"
            xcodebuild -exportArchive \
              -archivePath build/DebianTerminal.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/ipa \
              -allowProvisioningUpdates

            echo "==> Result"
            ls -lh build/ipa/
          else
            echo "==> Archive (unsigned)"
            xcodebuild -project DebianTerminal.xcodeproj -scheme DebianTerminal \
              -configuration Release -destination 'generic/platform=iOS' \
              -archivePath build/DebianTerminal.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              archive

            echo "==> Package unsigned IPA (Payload/DebianTerminal.app)"
            APP="$PWD/build/DebianTerminal.xcarchive/Products/Applications/DebianTerminal.app"
            mkdir -p Payload
            cp -R "$APP" Payload/
            ditto -c -k --keepParent Payload/DebianTerminal.app DebianTerminal-unsigned.ipa
            ls -lh DebianTerminal-unsigned.ipa
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebianTerminal-ipa
          path: |
            build/ipa/*.ipa
            DebianTerminal-unsigned.ipa
          if-no-files-found: error

# NOTE — runtime guest artifacts (qemu-system-aarch64 for iOS, Image, initrd.img,
# debian12.img) are NOT produced on the macOS runner. Build them on a Linux host
# with Scripts/build-debian.sh (and on a Mac with Scripts/build-qemu.sh), then add
# the small ones (Image, initrd.img, qemu-system-aarch64) to Resources/ and, for
# the 8 GiB debian12.img, transfer it separately into the app's Documents/Debian/
# on the device. The CI steps above only compile + package the iOS app shell.